<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{会议主题} 可视化纪要</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; background: #f8fafc; }
    .card { transition: transform .15s ease, box-shadow .15s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.08); }
    .tag { letter-spacing: .02em; }
    /* 导出栏：固定右下角，点击展开 PDF/PNG/JPG 选项 */
    .exp-bar { position: fixed; right: 24px; bottom: 24px; z-index: 50; font-family: 'Noto Sans SC', sans-serif; }
    .exp-toggle { display: flex; align-items: center; gap: 8px; background: #0f172a; color: #fff; border: none; border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(15,23,42,.25); transition: transform .12s ease; }
    .exp-toggle:hover { transform: translateY(-2px); }
    .exp-menu { position: absolute; right: 0; bottom: 60px; background: #fff; border-radius: 16px; box-shadow: 0 12px 32px rgba(15,23,42,.18); padding: 8px; display: none; min-width: 168px; }
    .exp-menu.open { display: block; }
    .exp-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-weight: 600; color: #334155; cursor: pointer; font-family: 'Noto Sans SC', sans-serif; }
    .exp-item:hover { background: #f1f5f9; }
    .exp-item svg { width: 18px; height: 18px; color: #64748b; }
    @media print {
      .exp-bar { display: none !important; }
      body { background: #fff; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body class="text-slate-800">

<!-- ================= 正文区开始：下方为示例骨架，按本次纪要重写 #capture 内全部内容 ================= -->
<div id="capture" class="max-w-6xl mx-auto px-6 py-10">

  <!-- Header：主题 + 副标题 + 日期 -->
  <div class="mb-10">
    <div class="text-sm text-slate-500 mb-2">{日期 · 版本标签}</div>
    <h1 class="text-4xl font-black text-slate-900 mb-3 leading-tight">{会议主题}</h1>
    <p class="text-lg text-slate-600">{一句话副标题：会议类型 + 核心内容}</p>
  </div>

  <!-- 会议信息 + 关键决议（左窄右宽两栏） -->
  <div class="grid md:grid-cols-3 gap-6 mb-12">
    <div class="md:col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
      <div class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">会议信息</div>
      <div class="space-y-3 text-sm">
        <div class="flex"><span class="w-16 text-slate-400">时间</span><span class="font-medium">{时间}</span></div>
        <div class="flex"><span class="w-16 text-slate-400">形式</span><span class="font-medium">{线上/线下}</span></div>
        <div class="flex"><span class="w-16 text-slate-400">参会</span><span class="font-medium">{参会人，缺失标⚠️待确认}</span></div>
      </div>
    </div>
    <div class="md:col-span-2 bg-gradient-to-r from-indigo-50 to-violet-50 rounded-2xl p-6 border border-indigo-100">
      <div class="flex items-center gap-2 mb-4">
        <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded tag">关键决议</span>
        <span class="text-indigo-900 font-bold">{本次会议必须带走的 N 件事}</span>
      </div>
      <div class="grid md:grid-cols-2 gap-4 text-sm">
        <!-- 逐条：数字圆标 + 决议内容，最多 5 条 -->
      </div>
    </div>
  </div>

  <!-- 分主题区块：每块一个 h2（彩色方块 + 标题），下方 2-3 列卡片网格 -->
  <!-- 区块配色：监管/规则=紫 #7c3aed；宣传/流程=青 #14b8a6；新规/门槛=粉 #d946ef；计划/时间线=琥珀 #f59e0b；总结=蓝 #2563eb -->
  <div class="mb-10">
    <h2 class="text-xl font-black text-slate-900 mb-5"><span class="inline-block w-2.5 h-5 bg-violet-600 rounded-sm align-middle mr-2"></span>{区块标题}</h2>
    <div class="grid md:grid-cols-3 gap-5">
      <div class="card bg-white rounded-2xl p-6 border border-slate-100">
        <div class="flex items-center gap-2 mb-3">
          <h3 class="font-bold text-slate-900">{卡片标题}</h3>
          <span class="bg-violet-100 text-violet-700 text-xs font-bold px-2 py-0.5 rounded tag">{标签}</span>
        </div>
        <ul class="text-sm text-slate-600 space-y-2">
          <li>{要点 1}</li>
          <li>{要点 2}</li>
          <li>{要点 3}</li>
        </ul>
      </div>
      <!-- 更多卡片... -->
    </div>
  </div>

  <!-- 流程/时间线区块：Step 1 → N 横向箭头 -->
  <div class="mb-10">
    <h2 class="text-xl font-black text-slate-900 mb-5"><span class="inline-block w-2.5 h-5 bg-amber-500 rounded-sm align-middle mr-2"></span>{行动/计划标题}</h2>
    <div class="bg-white rounded-2xl p-6 border border-slate-100">
      <div class="grid md:grid-cols-4 gap-6 relative">
        <div class="relative pr-6" style="position:relative;">
          <div class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded inline-block mb-2 tag">Step 1</div>
          <h3 class="font-bold text-slate-900 mb-2 text-sm">{步骤名}</h3>
          <p class="text-xs text-slate-600">{说明}</p>
          <span style="position:absolute; right:0; top:50%; transform:translateY(-50%); font-size:22px; color:#cbd5e1;">→</span>
        </div>
        <!-- Step 2 / 3 / 4 同构；最后一步去掉箭头 -->
      </div>
    </div>
  </div>

  <!-- 总结与建议区块：蓝色高亮框 -->
  <div class="mb-6">
    <h2 class="text-xl font-black text-slate-900 mb-5"><span class="inline-block w-2.5 h-5 bg-blue-600 rounded-sm align-middle mr-2"></span>总结与建议</h2>
    <div class="bg-blue-50 rounded-2xl p-6 border border-blue-100">
      <div class="flex items-start gap-4">
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 mt-0.5">✓</div>
        <div>
          <h3 class="font-bold text-slate-900 mb-2">{建议标题}</h3>
          <p class="text-sm text-slate-700">{建议正文，2-4 句}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="text-xs text-slate-400 text-center pt-4">
    生成时间：{YYYY-MM-DD} · 基于会议转录稿整理 · 完整文字版见配套 Word/Markdown
  </div>

</div>
<!-- ================= 正文区结束 ================= -->

<!-- 导出栏：固定右下角，PDF/PNG/JPG 三选一。必须原样保留，勿删 -->
<div class="exp-bar">
  <div class="exp-menu" id="expMenu">
    <button class="exp-item" onclick="exportPDF()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M4 17V5a2 2 0 012-2h8l6 6v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>
      导出 PDF
    </button>
    <button class="exp-item" onclick="exportImage('png')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      导出 PNG
    </button>
    <button class="exp-item" onclick="exportImage('jpg')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      导出 JPG
    </button>
  </div>
  <button class="exp-toggle" id="expToggle" onclick="document.getElementById('expMenu').classList.toggle('open')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
    导出
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function exportPDF(){ window.print(); }
  async function exportImage(type){
    document.getElementById('expMenu').classList.remove('open');
    const el = document.getElementById('capture');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#f8fafc', useCORS: true, logging: false });
    const link = document.createElement('a');
    link.download = document.title + '.' + (type === 'png' ? 'png' : 'jpg');
    link.href = canvas.toDataURL(type === 'png' ? 'image/png' : 'image/jpeg', 0.95);
    link.click();
  }
</script>

</body>
</html>
